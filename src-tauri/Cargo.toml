[package]
name = "selection-translate"
version = "0.1.0"
description = "Lightweight global selection-to-English translator"
authors = ["WorkBuddy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "selection_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
enigo = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redb = "2"
keyring = "3"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
